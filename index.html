<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- icon link -->
    <link rel="icon" href="assets/icon.png" type="image/png">
    <title>ConnectSphere - Home</title>
    <!-- Google Fonts CDN -->
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;family=Be+Vietnam+Pro:wght@400;500&amp;display=swap"
        rel="stylesheet" />

    <!-- Material Icons -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined">

    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- style files -->
    <link rel="stylesheet" href="css/designsystem.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/module.css">
    <link rel="stylesheet" href="css/state.css">

</head>

<body class="home-page">
    <div class="home-container">
        <!-- Top Navigation -->
        <nav class="top-nav">
            <div class="top-nav-logo">
                <h1 class="top-nav-logo-text">ConnectSphere</h1>
            </div>
            <div class="top-nav-search">
                <span class="material-symbols-outlined">search</span>
                <input type="text" class="top-nav-search-input" placeholder="Search ConnectSphere">
            </div>
            <div class="top-nav-actions">
                <button class="top-nav-icon-btn notification-btn">
                    <span class="material-symbols-outlined">notifications</span>
                </button>
                <button class="top-nav-icon-btn account-btn">
                    <img src="./image/default-image-profile.png" alt="Your avatar">
                </button>
            </div>
        </nav>

        <!-- Main Content Area -->
        <div class="main-feed-container">
            <!-- Left Sidebar -->
            <aside class="sidebar-left">
                <nav class="sidebar-nav">
                    <a href="index.html" class="sidebar-nav-item active">
                        <span class="material-symbols-outlined">home</span>
                        <span>Home</span>
                    </a>
                    <a href="notifications.html" class="sidebar-nav-item">
                        <span class="material-symbols-outlined">notifications</span>
                        <span>Notifications</span>
                    </a>
                    <a href="bookmarks.html" class="sidebar-nav-item">
                        <span class="material-symbols-outlined">bookmarks</span>
                        <span>Bookmarks</span>
                    </a>
                    <a href="profile.html" class="sidebar-nav-item">
                        <span class="material-symbols-outlined">person</span>
                        <span>Profile</span>
                    </a>
                </nav>

                <div class="sidebar-footer">
                    <a href="settings.html" class="sidebar-nav-item">
                        <span class="material-symbols-outlined">settings</span>
                        <span>Settings</span>
                    </a>
                </div>
            </aside>

            <!-- Center Feed -->
            <main class="feed-center">
                <div id="banner" class="security_card_banner">
                    <i id="banner-icon" class="fa-solid fa-envelope"></i>
                    <span id="banner-text"></span>
                </div>
                <!-- Compose Tweet -->
                <div class="compose-card">
                    <div class="compose-header">
                        <img src="./image/default-image-profile.png" alt="Your avatar" class="compose-avatar">
                        <div class="compose-content">
                            <textarea class="compose-textarea" placeholder="What's happening?"></textarea>
                            <input type="file" id="imageUpload" accept="image/*" hidden multiple>
                            <div class="compose-image-preview"></div>
                            <div class="compose-toolbar">
                                <div class="compose-icons">
                                    <button class="compose-icon-btn">
                                        <span class="material-symbols-outlined">image</span>
                                    </button>
                                    <button class="compose-icon-btn emoji-picker-btn">
                                        <span class="material-symbols-outlined">emoji_objects</span>
                                    </button>
                                </div>
                                <button class="compose-post-btn">Post</button>
                            </div>
                            <div class="emoji-picker-overlay hidden">
                                <div class="emoji-picker-container">
                                    <div class="emoji-grid">
                                    </div>
                                    <button class="emoji-picker-close">×</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="feed-posts-list"></div>
            </main>

            <!-- Right Sidebar -->
            <aside class="sidebar-right">
                <!-- Who to Follow Section -->
                <div class="who-to-follow-card">
                    <h3 class="who-to-follow-title">Who to follow</h3>
                    <a href="#" class="show-more-link">Show more</a>
                </div>
            </aside>
        </div>
    </div>

    <!-- scripts -->
    <script type="module" src="js/index.js"></script>
    <script type="module" src="js/util/show.js"></script>
    <script type="module" src="js/util/global.js"></script>
</body>

</html>
