<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assets/icon.png" type="image/png">
    <title>ConnectSphere - Post</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;family=Be+Vietnam+Pro:wght@400;500&amp;display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/designsystem.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/module.css">
    <link rel="stylesheet" href="css/state.css">
</head>

<body class="home-page">
    <div class="home-container">
        <nav class="top-nav">
            <div class="top-nav-logo">
                <h1 class="top-nav-logo-text">ConnectSphere</h1>
            </div>
            <div class="top-nav-search">
                <span class="material-symbols-outlined">search</span>
                <input type="text" class="top-nav-search-input" placeholder="Search ConnectSphere">
            </div>
            <div class="top-nav-actions">
                <button class="top-nav-icon-btn" aria-label="Messages">
                    <span class="material-symbols-outlined">mail</span>
                </button>
                <button class="top-nav-icon-btn" aria-label="Notifications">
                    <span class="material-symbols-outlined">notifications</span>
                    <span class="notification-badge">3</span>
                </button>
                <button class="top-nav-icon-btn" aria-label="Profile">
                    <span class="material-symbols-outlined">account_circle</span>
                </button>
            </div>
        </nav>

        <div class="main-feed-container">
            <aside class="sidebar-left">
                <nav class="sidebar-nav">
                    <a href="index.html" class="sidebar-nav-item">
                        <span class="material-symbols-outlined">home</span>
                        <span>Home</span>
                    </a>
                    <a href="index.html" class="sidebar-nav-item">
                        <span class="material-symbols-outlined">explore</span>
                        <span>Explore</span>
                    </a>
                    <a href="messaging.html" class="sidebar-nav-item">
                        <span class="material-symbols-outlined">mail</span>
                        <span>Messages</span>
                    </a>
                    <a href="notifications.html" class="sidebar-nav-item">
                        <span class="material-symbols-outlined">notifications</span>
                        <span>Notifications</span>
                    </a>
                    <a href="bookmarks.html" class="sidebar-nav-item">
                        <span class="material-symbols-outlined">bookmarks</span>
                        <span>Bookmarks</span>
                    </a>
                </nav>

                <div class="sidebar-footer">
                    <a href="index.html" class="sidebar-nav-item">
                        <span class="material-symbols-outlined">settings</span>
                        <span>Settings</span>
                    </a>
                </div>
            </aside>

            <main class="feed-center">
                <div class="post-container">
                    <article class="feed-item post-card">
                        <div class="feed-item-header post-hero">
                            <img class="feed-item-avatar post-avatar" src="assets/default-avatar.png" alt="Author">
                            <div class="feed-item-meta post-hero-info">
                                <div class="feed-item-user post-author-row">
                                    <span class="feed-item-name post-author-name">Loading author</span>
                                    <span class="feed-item-handle post-author-handle">@loading</span>
                                </div>
                                <span class="feed-item-time post-time">• ...</span>
                            </div>
                            <button class="feed-item-menu" type="button">
                                <span class="material-symbols-outlined">more_vert</span>
                            </button>
                        </div>

                        <div class="feed-item-content post-content">
                            <p>Loading post content. Please wait.</p>
                        </div>

                        <div class="feed-item-actions post-footer">
                            <button class="feed-item-action reaction-btn" type="button"><span
                                    class="material-symbols-outlined">chat</span></button>
                            <button class="feed-item-action reaction-btn" type="button"><span
                                    class="material-symbols-outlined">repeat</span></button>
                            <button class="feed-item-action reaction-btn" type="button"><span
                                    class="material-symbols-outlined">favorite</span></button>
                            <button class="feed-item-action reaction-btn" type="button"><span
                                    class="material-symbols-outlined">share</span></button>
                        </div>
                    </article>
                </div>
            </main>

            <aside class="sidebar-right">
                <div class="trending-card">
                    <h3 class="trending-title">What’s happening</h3>
                    <div class="trending-item">
                        <span class="trending-category">Technology • Trending</span>
                        <h4 class="trending-topic">#DesignTokens</h4>
                        <span class="trending-count">28.1K posts</span>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <!-- scripts -->
    <script type="module" src="js/post-page.js"></script>
</body>

</html>
