<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assets/icon.png" type="image/png">
    <title>ConnectSphere - Profile</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;family=Be+Vietnam+Pro:wght@400;500;600&amp;display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/designsystem.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/module.css">
    <link rel="stylesheet" href="css/state.css">
</head>

<body class="home-page profile-page">
    <div class="home-container">
        <div id="banner" class="security_card_banner">
            <span id="banner-icon" class="fa-solid fa-envelope"></span>
            <p id="banner-text"></p>
        </div>
        <nav class="top-nav">
            <div class="top-nav-logo">
                <h1 class="top-nav-logo-text">ConnectSphere</h1>
            </div>
            <div class="top-nav-search">
                <span class="material-symbols-outlined">search</span>
                <input type="text" class="top-nav-search-input" placeholder="Search ConnectSphere">
            </div>
            <div class="top-nav-actions">
                <button class="top-nav-icon-btn notification-btn">
                    <span class="material-symbols-outlined">notifications</span>
                </button>
                <button class="top-nav-icon-btn account-btn">
                    <img src="./image/default-image-profile.png" alt="Your avatar">
                </button>
            </div>
        </nav>

        <div class="main-feed-container">
            <aside class="sidebar-left">
                <nav class="sidebar-nav">
                    <a href="index.html" class="sidebar-nav-item">
                        <span class="material-symbols-outlined">home</span>
                        <span>Home</span>
                    </a>
                    <a href="notifications.html" class="sidebar-nav-item">
                        <span class="material-symbols-outlined">notifications</span>
                        <span>Notifications</span>
                    </a>
                    <a href="bookmarks.html" class="sidebar-nav-item">
                        <span class="material-symbols-outlined">bookmarks</span>
                        <span>Bookmarks</span>
                    </a>
                    <a href="profile.html" class="sidebar-nav-item active">
                        <span class="material-symbols-outlined">person</span>
                        <span>Profile</span>
                    </a>
                </nav>
                <div class="sidebar-footer">
                    <a href="settings.html" class="sidebar-nav-item">
                        <span class="material-symbols-outlined">settings</span>
                        <span>Settings</span>
                    </a>
                </div>
            </aside>

            <main class="feed-center">
                <div class="feed-header">
                    <h2>Profile</h2>
                </div>

                <div class="profile-posts-list">

                </div>
            </main>

            <aside class="sidebar-right">
                <div class="who-to-follow-card">
                    <h3 class="who-to-follow-title">Who to follow</h3>
                    <a href="#" class="show-more-link">Show more</a>
                    <div class="who-to-follow-list"></div>
                </div>
            </aside>
        </div>
    </div>
    <script type="module" src="js/profile.js"></script>
    <script type="module" src="js/util/global.js"></script>
</body>

</html>
